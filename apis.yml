aid: pratilipi
name: Pratilipi
description: >-
  Pratilipi is India's largest digital storytelling platform, democratizing story creation and
  consumption across languages, formats, and boundaries. Built by Nasadiya Technologies Private
  Limited and headquartered in Bangalore, it lets more than 300,000 self-published writers reach
  roughly 25 million monthly readers across twelve Indian languages (Hindi, Gujarati, Marathi,
  Bengali, English, Tamil, Telugu, Kannada, Malayalam, Punjabi, Urdu, and Odia). The ecosystem
  spans Pratilipi Literature, Pratilipi FM (audio books, podcasts, and folk songs), Pratilipi
  Comics (the largest Hindi online comic platform), Westland Publications, and IVM Podcasts,
  carrying a story "from someone's draft to someone's screen." Pratilipi does not publish a public
  developer API; this profile captures the company's identity, web properties, and domain-security
  posture for the API Evangelist network.
